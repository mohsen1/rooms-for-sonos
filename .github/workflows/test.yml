name: Test

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -s sh app/sonos.sh app/setup.sh app/www/cgi-bin/rooms install.sh uninstall.sh deploy/*/apply.sh deploy/*/remove.sh test/*.sh

  busybox-and-lighttpd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/src:ro" alpine:3.22 sh /src/test/run.sh

  entware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/src:ro" alpine:3.22 sh /src/test/entware.sh
