# Rooms for Sonos.
# Safari tries HTTPS first. nginx refuses that at once so Safari falls back to plain HTTP,
# where uhttpd on its own would sit waiting and leave the page hanging.
server {
    listen @PORT@;
    root @HOME@/www;
    index index.html;

    # iOS only opens the page with no network when it's marked like this.
    # The page reloads itself when the status reply reports a newer version.
    location = /index.html {
        add_header Cache-Control "public, max-age=2592000, immutable, stale-if-error=2592000";
    }

    location /cgi-bin/ {
        proxy_pass http://127.0.0.1:@BACKEND_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }
}
