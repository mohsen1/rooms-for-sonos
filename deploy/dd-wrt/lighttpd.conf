# Rooms for Sonos.
# lighttpd refuses a browser's HTTPS attempt at once, so Safari falls back to plain HTTP.

server.modules = ( "mod_setenv", "mod_cgi" )

server.port = @PORT@
server.document-root = "@HOME@/www"
server.pid-file = "/tmp/rooms-lighttpd.pid"
server.errorlog = "/tmp/rooms-lighttpd.log"
server.upload-dirs = ( "/tmp" )
index-file.names = ( "index.html" )

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".json" => "application/json",
  ".png" => "image/png"
)

$HTTP["url"] =~ "^/cgi-bin/" {
  cgi.assign = ( "" => "" )
}

# iOS only opens the page with no network when it's marked like this.
# The page reloads itself when the status reply reports a newer version.
$HTTP["url"] =~ "^/(index\.html)?$" {
  setenv.add-response-header = (
    "Cache-Control" => "public, max-age=2592000, immutable, stale-if-error=2592000"
  )
}
